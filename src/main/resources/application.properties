spring.application.name=routinely

# Conexão com o banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_ROUTINELY}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Configuração do JPA e Dialeto Espacial (PostGIS)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativar Flyway temporariamente até eu criar o primeiro script
spring.flyway.enabled=false

